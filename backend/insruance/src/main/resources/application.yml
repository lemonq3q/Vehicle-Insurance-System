spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: InsuranceSystem
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/insurance_saas?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 20040619Lmy
      driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    key-prefix: ${REDIS_KEY_PREFIX:insurance:}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true  # 自动转换驼峰命名

server:
  port: 8080

insurance:
  tenant-isolation:
    enabled: true
  sso:
    # 车险后端使用的 SaaS 后端内部授权码兑换地址。
    saas-exchange-url: ${SAAS_SSO_EXCHANGE_URL:http://localhost:8081/internal/sso/exchange}
    portal-authorize-url: ${SAAS_PORTAL_AUTHORIZE_URL:http://localhost:8081/internal/sso/portal-authorize}
    # 必须与 SaaS 服务器的 INSURANCE_SSO_CLIENT_SECRET 一致。
    client-secret: ${INSURANCE_SSO_CLIENT_SECRET:wsbld2wjb56gjlmy}

app:
  cors:
    enabled: true

maintenance:
  participant:
    enabled: ${MAINTENANCE_PARTICIPANT_ENABLED:true}
    service-id: insurance-backend
    internal-secret: ${MAINTENANCE_INTERNAL_SECRET:dev-maintenance-secret}
    drain-timeout-seconds: ${MAINTENANCE_DRAIN_TIMEOUT_SECONDS:120}
    lease-timeout-seconds: ${MAINTENANCE_LEASE_TIMEOUT_SECONDS:300}
    lease-check-interval-ms: ${MAINTENANCE_LEASE_CHECK_INTERVAL_MS:5000}
    standalone-exit-delay-seconds: ${MAINTENANCE_STANDALONE_EXIT_DELAY_SECONDS:60}
    fallback-cron: ${MAINTENANCE_FALLBACK_CRON:0 5 4 * * ?}
    zone: Asia/Shanghai

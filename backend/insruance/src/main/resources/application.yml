spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: InsuranceSystem
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/insurance_saas?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 20040619Lmy
      driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    key-prefix: ${REDIS_KEY_PREFIX:insurance:}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true  # 自动转换驼峰命名

server:
  port: 8080

renewal:
  cycle-months: ${RENEWAL_CYCLE_MONTHS:12}

insurance:
  ai:
    provider: ${POLICY_OCR_PROVIDER:qwen}
    # 开启后打印保单识别及结构整理的完整模型返回正文；修改后重启车险后端。
    log-model-output: ${POLICY_OCR_LOG_MODEL_OUTPUT:false}
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:}
    ocr-model: ${POLICY_OCR_MODEL:qwen3.8-flash}
    organizer-model: ${POLICY_OCR_ORGANIZER_MODEL:qwen3.8-flash}
    doubao-api-key: ${ARK_API_KEY:}
    doubao-base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    doubao-ocr-model: ${POLICY_OCR_DOUBAO_MODEL:doubao-seed-2-1-lite-260915}
    doubao-organizer-model: ${POLICY_OCR_DOUBAO_ORGANIZER_MODEL:doubao-seed-2-1-lite-260915}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    gemini-ocr-model: ${POLICY_OCR_GEMINI_MODEL:gemini-3.8-flash}
    gemini-organizer-model: ${POLICY_OCR_GEMINI_ORGANIZER_MODEL:gemini-3.8-flash}
    organizer-retries: ${POLICY_OCR_ORGANIZER_RETRIES:2}
    ocr-request-retries: ${POLICY_OCR_REQUEST_RETRIES:2}
  wechat:
    # 两端使用同一个网站应用；先执行增量 SQL，再启用微信登录。
    account-enabled: true
    enabled: ${WECHAT_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    # 两端内部统一使用 callback-uri，保留现有部署变量但避免共享环境中的名称冲突。
    callback-uri: ${INSURANCE_WECHAT_REDIRECT_URI:http://localhost:8888/wechat/callback}
    message-token: ${WECHAT_MESSAGE_TOKEN:}
    encoding-aes-key: ${WECHAT_ENCODING_AES_KEY:}
  email:
    account-enabled: true
    provider: ${EMAIL_PROVIDER:qq}
    qq:
      user: ${QQ_EMAIL_USER:}
      password: ${QQ_EMAIL_AUTH_CODE:}
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}
      from: ${GMAIL_FROM:}
  tenant-isolation:
    enabled: true
  oss:
    temporary-url:
      # 私有 OSS GET 签名和 Redis 缓存的统一生命周期；缓存必须早于签名失效。
      expire-minutes: ${OSS_TEMP_URL_EXPIRE_MINUTES:1440}
      cache-minutes: ${OSS_TEMP_URL_CACHE_MINUTES:1380}
  sso:
    # 车险后端使用的 SaaS 后端内部授权码兑换地址。
    saas-exchange-url: ${SAAS_SSO_EXCHANGE_URL:http://localhost:8081/internal/sso/exchange}
    portal-authorize-url: ${SAAS_PORTAL_AUTHORIZE_URL:http://localhost:8081/internal/sso/portal-authorize}
    # 必须与 SaaS 服务器的 INSURANCE_SSO_CLIENT_SECRET 一致。
    client-secret: ${INSURANCE_SSO_CLIENT_SECRET:wsbld2wjb56gjlmy}

app:
  cors:
    enabled: true

maintenance:
  participant:
    enabled: ${MAINTENANCE_PARTICIPANT_ENABLED:true}
    service-id: insurance-backend
    internal-secret: ${MAINTENANCE_INTERNAL_SECRET:dev-maintenance-secret}
    drain-timeout-seconds: ${MAINTENANCE_DRAIN_TIMEOUT_SECONDS:120}
    lease-timeout-seconds: ${MAINTENANCE_LEASE_TIMEOUT_SECONDS:300}
    lease-check-interval-ms: ${MAINTENANCE_LEASE_CHECK_INTERVAL_MS:5000}
    standalone-exit-delay-seconds: ${MAINTENANCE_STANDALONE_EXIT_DELAY_SECONDS:60}
    fallback-cron: ${MAINTENANCE_FALLBACK_CRON:0 5 4 * * ?}
    zone: Asia/Shanghai

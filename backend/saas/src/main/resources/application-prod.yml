spring:
  config:
    activate:
      on-profile: prod

portal:
  sso:
    insurance-frontend-url: ${INSURANCE_FRONTEND_URL:https://www.idatag.com/insurance}
    portal-frontend-url: ${PORTAL_FRONTEND_URL:https://www.idatag.com/saas}
  insurance-session:
    logout-enterprise-url: ${INSURANCE_LOGOUT_ENTERPRISE_URL:https://www.idatag.com/insuranceback/internal/session/logout-enterprise}
    logout-user-url: ${INSURANCE_LOGOUT_USER_URL:https://www.idatag.com/insuranceback/internal/session/logout-user}

app:
  cors:
    enabled: false

maintenance:
  participant:
    internal-secret: ${MAINTENANCE_INTERNAL_SECRET}
    drain-timeout-seconds: ${MAINTENANCE_DRAIN_TIMEOUT_SECONDS:900}
    lease-timeout-seconds: ${MAINTENANCE_LEASE_TIMEOUT_SECONDS:900}
    lease-check-interval-ms: ${MAINTENANCE_LEASE_CHECK_INTERVAL_MS:10000}
    standalone-exit-delay-seconds: ${MAINTENANCE_STANDALONE_EXIT_DELAY_SECONDS:900}
    fallback-cron: ${MAINTENANCE_FALLBACK_CRON:0 15 4 * * ?}

saas:
  data-retention:
    retention-days: ${ENTERPRISE_DATA_RETENTION_DAYS:90}
    insurance-purge-url: ${INSURANCE_ENTERPRISE_PURGE_URL:https://www.idatag.com/insuranceback/internal/maintenance/enterprise-data/purge}
    connect-timeout-seconds: ${INSURANCE_ENTERPRISE_PURGE_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${INSURANCE_ENTERPRISE_PURGE_READ_TIMEOUT_SECONDS:1800}

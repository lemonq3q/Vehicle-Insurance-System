spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: InsuranceSystemSaas
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/insurance_saas?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 20040619Lmy
      driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    key-prefix: ${REDIS_KEY_PREFIX:portal:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

portal:
  sso:
    # 可修改为车险前端的正式域名，不要带末尾斜杠。
    insurance-frontend-url: ${INSURANCE_FRONTEND_URL:http://localhost:8888}
    portal-frontend-url: ${PORTAL_FRONTEND_URL:http://localhost:8889}
    # 两台服务器上配置相同的高强度密钥，生产环境必须修改。
    insurance-client-secret: ${INSURANCE_SSO_CLIENT_SECRET:wsbld2wjb56gjlmy}
    code-ttl-seconds: ${INSURANCE_SSO_CODE_TTL_SECONDS:60}
  insurance-session:
    logout-enterprise-url: ${INSURANCE_LOGOUT_ENTERPRISE_URL:http://localhost:8080/internal/session/logout-enterprise}
    logout-user-url: ${INSURANCE_LOGOUT_USER_URL:http://localhost:8080/internal/session/logout-user}

app:
  cors:
    enabled: true

maintenance:
  participant:
    enabled: ${MAINTENANCE_PARTICIPANT_ENABLED:true}
    service-id: saas-backend
    internal-secret: ${MAINTENANCE_INTERNAL_SECRET:dev-maintenance-secret}
    drain-timeout-seconds: ${MAINTENANCE_DRAIN_TIMEOUT_SECONDS:120}
    lease-timeout-seconds: ${MAINTENANCE_LEASE_TIMEOUT_SECONDS:300}
    lease-check-interval-ms: ${MAINTENANCE_LEASE_CHECK_INTERVAL_MS:5000}
    standalone-exit-delay-seconds: ${MAINTENANCE_STANDALONE_EXIT_DELAY_SECONDS:60}
    fallback-cron: ${MAINTENANCE_FALLBACK_CRON:0 5 4 * * ?}
    zone: Asia/Shanghai

saas:
  billing:
    workorder-overage:
      # 超额工单从录入日开始，每经过一个完整周期再次计费。
      cycle-days: ${WORKORDER_OVERAGE_CYCLE_DAYS:365}
      unit-price: ${WORKORDER_OVERAGE_UNIT_PRICE:0.20}
    balance-access:
      # 有效套餐余额严格低于该值时暂停车险业务访问；超额工单扣费允许穿透到负数。
      suspend-threshold: ${BALANCE_SUSPEND_THRESHOLD:-100.00}
      # 欠费暂停企业余额严格高于该值时恢复；与停止阈值之间保留缓冲区避免反复切换。
      restore-threshold: ${BALANCE_RESTORE_THRESHOLD:0.00}

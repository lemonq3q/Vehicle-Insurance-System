spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: InsuranceSystemSaas
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/insurance_saas?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 20040619Lmy
      driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    key-prefix: ${REDIS_KEY_PREFIX:portal:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

portal:
  sso:
    # 可修改为车险前端的正式域名，不要带末尾斜杠。
    insurance-frontend-url: ${INSURANCE_FRONTEND_URL:http://localhost:8888}
    portal-frontend-url: ${PORTAL_FRONTEND_URL:http://localhost:8887}
    # 两台服务器上配置相同的高强度密钥，生产环境必须修改。
    insurance-client-secret: ${INSURANCE_SSO_CLIENT_SECRET:wsbld2wjb56gjlmy}
    code-ttl-seconds: ${INSURANCE_SSO_CODE_TTL_SECONDS:60}
  insurance-session:
    logout-enterprise-url: ${INSURANCE_LOGOUT_ENTERPRISE_URL:http://localhost:8080/internal/session/logout-enterprise}
    logout-user-url: ${INSURANCE_LOGOUT_USER_URL:http://localhost:8080/internal/session/logout-user}

app:
  cors:
    enabled: true

maintenance:
  participant:
    enabled: ${MAINTENANCE_PARTICIPANT_ENABLED:true}
    service-id: saas-backend
    internal-secret: ${MAINTENANCE_INTERNAL_SECRET:dev-maintenance-secret}
    drain-timeout-seconds: ${MAINTENANCE_DRAIN_TIMEOUT_SECONDS:120}
    lease-timeout-seconds: ${MAINTENANCE_LEASE_TIMEOUT_SECONDS:300}
    lease-check-interval-ms: ${MAINTENANCE_LEASE_CHECK_INTERVAL_MS:5000}
    standalone-exit-delay-seconds: ${MAINTENANCE_STANDALONE_EXIT_DELAY_SECONDS:60}
    fallback-cron: ${MAINTENANCE_FALLBACK_CRON:0 5 4 * * ?}
    zone: Asia/Shanghai

saas:
  visitor-lead:
    # 官网匿名提交仅接受明确允许的 Origin/Referer；生产域名与本地联调地址集中配置，禁止客户端自行声明来源。
    allowed-origins: ${VISITOR_LEAD_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:8887,http://127.0.0.1:8887,https://www.idatag.com,https://idatag.com}
    rate-limit-seconds: ${VISITOR_LEAD_RATE_LIMIT_SECONDS:60}
    trust-proxy-headers: ${VISITOR_LEAD_TRUST_PROXY_HEADERS:false}
  reminder:
    first-expiry-warning-days: ${REMINDER_FIRST_EXPIRY_WARNING_DAYS:7}
    urgent-expiry-warning-days: ${REMINDER_URGENT_EXPIRY_WARNING_DAYS:1}
    quota-first-percent: ${REMINDER_QUOTA_FIRST_PERCENT:80}
    quota-urgent-percent: ${REMINDER_QUOTA_URGENT_PERCENT:90}
    near-suspension-ratio: ${REMINDER_NEAR_SUSPENSION_RATIO:0.80}
    data-deletion-warning-days: ${REMINDER_DATA_DELETION_WARNING_DAYS:30,15,3}
    monitor-merge-url: ${MONITOR_REMINDER_MERGE_URL:http://localhost:8083/internal/reminders/merge}
    monitor-delete-url: ${MONITOR_REMINDER_DELETE_URL:http://localhost:8083/internal/reminders/delete}
  data-retention:
    # 最近一次套餐结束超过该天数后，清除企业在车险域内的业务资料；成员、钱包和订阅不受影响。
    retention-days: ${ENTERPRISE_DATA_RETENTION_DAYS:90}
    insurance-purge-url: ${INSURANCE_ENTERPRISE_PURGE_URL:http://localhost:8080/internal/maintenance/enterprise-data/purge}
    connect-timeout-seconds: ${INSURANCE_ENTERPRISE_PURGE_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${INSURANCE_ENTERPRISE_PURGE_READ_TIMEOUT_SECONDS:1200}
  billing:
    workorder-overage:
      # 超额工单从录入日开始，每经过一个完整周期再次计费。
      cycle-days: ${WORKORDER_OVERAGE_CYCLE_DAYS:365}
      unit-price: ${WORKORDER_OVERAGE_UNIT_PRICE:0.20}
    balance-access:
      # 有效套餐余额严格低于该值时暂停车险业务访问；超额工单扣费允许穿透到负数。
      suspend-threshold: ${BALANCE_SUSPEND_THRESHOLD:-100.00}
      # 欠费暂停企业余额严格高于该值时恢复；与停止阈值之间保留缓冲区避免反复切换。
      restore-threshold: ${BALANCE_RESTORE_THRESHOLD:0.00}

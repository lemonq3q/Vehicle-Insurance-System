<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>车险管理系统 · 工单管理 UI 样例</title>
  <style>
    :root{--nav:#0f172a;--nav-text:#aebcd0;--primary:#1e40af;--primary-hover:#1d4ed8;--bg:#f4f7fb;--surface:#fff;--text:#0f172a;--sub:#475569;--muted:#64748b;--line:#dbe4f0;--soft:#f8fafc;--shadow:0 8px 24px rgba(15,23,42,.06);--radius:10px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Open Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}a{text-decoration:none;color:inherit}
    .app{min-height:100dvh}.sidebar{position:fixed;inset:0 auto 0 0;width:246px;background:var(--nav);color:var(--nav-text);padding:20px 14px;z-index:20;overflow:auto}.brand{display:flex;gap:11px;align-items:center;padding:6px 10px 20px;border-bottom:1px solid rgba(255,255,255,.09)}.brand-mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#22c55e,#1e40af);color:white;font-size:23px;font-weight:800}.brand strong{display:block;color:#fff;font-size:18px;letter-spacing:.02em}.brand small{display:block;color:#94a3b8;font-size:11px;margin-top:2px}.nav-caption{margin:25px 12px 8px;font-size:11px;letter-spacing:.1em;color:#74859e}.nav-link{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 12px;margin:3px 0;border-radius:8px;font-size:14px}.nav-link:hover{background:rgba(255,255,255,.07);color:#fff}.nav-link.active{background:#1e40af;color:#fff;box-shadow:0 8px 20px rgba(30,64,175,.28)}.nav-icon{width:19px;text-align:center;font-size:18px;line-height:1}.sidebar-foot{margin:28px 8px 0;padding:16px 8px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;line-height:1.6;color:#8495ac}
    .header{position:sticky;top:0;z-index:10;height:68px;margin-left:246px;padding:0 28px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.hamburger{display:none}.breadcrumb{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.breadcrumb strong{color:var(--text);font-weight:650}.header-actions{margin-left:auto;display:flex;align-items:center;gap:12px}.header-link{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--sub);padding:9px 13px;font-size:13px}.header-link:hover{border-color:#93c5fd;color:var(--primary)}.avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe;color:var(--primary);display:grid;place-items:center;font-weight:700}.user{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}.user small{display:block;color:var(--muted);font-weight:400}
    main{margin-left:246px;padding:28px;max-width:1900px}.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:var(--primary);font-size:11px;font-weight:800;letter-spacing:.12em}.page-heading h1{margin:0;font-size:26px;line-height:1.25}.page-heading p:last-child{margin:7px 0 0;color:var(--muted);font-size:13px}.badge-demo{display:inline-flex;align-items:center;padding:7px 10px;border-radius:99px;background:#e9f1ff;color:#1e40af;font-size:12px;font-weight:700}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel + .panel{margin-top:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:19px 22px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:17px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.panel-body{padding:20px 22px}
    .filter-grid{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(3,minmax(155px,1fr));gap:16px}.field label{display:block;margin-bottom:7px;color:var(--sub);font-size:12px;font-weight:650}.control{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:7px;padding:0 12px;background:#fff;color:var(--text);font-size:13px}.control::placeholder{color:#94a3b8}.control:focus{border-color:var(--primary)}.filter-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:20px;flex-wrap:wrap}.status-group{display:flex;flex-wrap:wrap;gap:7px}.status-chip{height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--sub);padding:0 12px;font-size:12px}.status-chip:hover{border-color:#9fb4dd}.status-chip.active{background:#eaf0ff;color:var(--primary);border-color:#b9c9f2;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 15px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--sub);font-size:13px;font-weight:650;white-space:nowrap}.btn:hover{background:#f8fbff;border-color:#a5bde8}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-hover)}.btn.text{border-color:transparent;color:var(--primary);background:transparent;padding:0 7px}.btn.text:hover{background:#eff6ff}.btn.small{height:30px;padding:0 10px;font-size:12px}
    .result-title{display:flex;align-items:center;gap:10px}.count{color:var(--muted);font-size:12px}.table-wrap{width:100%;overflow-x:auto}table{width:100%;min-width:1080px;border-collapse:collapse;font-size:13px}thead{background:var(--soft)}th{text-align:left;padding:14px 16px;color:var(--sub);font-size:12px;font-weight:700;white-space:nowrap}td{padding:15px 16px;border-top:1px solid #edf1f6;color:var(--sub);white-space:nowrap}tbody tr:hover{background:#f8fbff}.order{font-weight:700;color:var(--primary)}.vehicle{font-weight:700;color:var(--text)}.cell-sub{display:block;margin-top:4px;color:var(--muted);font-size:11px}.money{font-variant-numeric:tabular-nums;color:var(--text);font-weight:650}.state{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.state:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.state.quote{color:#1d4ed8;background:#dbeafe}.state.insure{color:#a16207;background:#fef3c7}.state.fail{color:#b91c1c;background:#fee2e2}.state.done{color:#047857;background:#d1fae5}.row-actions{display:flex;gap:7px}.pagination{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.page-buttons{display:flex;gap:5px}.page-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--sub)}.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}.empty{padding:48px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;right:24px;bottom:24px;z-index:50;padding:13px 17px;background:var(--nav);color:#fff;border-radius:8px;box-shadow:var(--shadow);font-size:13px}.mobile-scrim{display:none}
    @media(max-width:1300px){.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:transform .2s ease}.sidebar.open{transform:translateX(0)}.mobile-scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:15}.header,main{margin-left:0}.hamburger{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--sub)}}@media(max-width:620px){.header{padding:0 14px}.header-link,.user small{display:none}main{padding:18px 12px}.page-heading{align-items:flex-start;flex-direction:column}.page-heading h1{font-size:23px}.panel-head{padding:16px}.panel-body{padding:16px}.filter-grid{grid-template-columns:1fr}.filter-bottom{align-items:stretch}.actions{width:100%}.actions .btn{flex:1}.pagination{padding:14px 16px}.breadcrumb{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app">
    <div class="mobile-scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="车险系统导航">
      <div class="brand"><div class="brand-mark" aria-hidden="true">i</div><div><strong>iDatag</strong><small>车险管理系统</small></div></div>
      <nav aria-label="主导航">
        <p class="nav-caption">业务工作台</p>
        <a class="nav-link active" href="#orders" aria-current="page"><span class="nav-icon" aria-hidden="true">▤</span>工单管理</a>
        <a class="nav-link" href="#" data-demo="工单续保"><span class="nav-icon" aria-hidden="true">◷</span>工单续保</a>
        <p class="nav-caption">渠道管理</p>
        <a class="nav-link" href="#" data-demo="上游管理"><span class="nav-icon" aria-hidden="true">⌁</span>上游管理</a>
        <a class="nav-link" href="#" data-demo="下游管理"><span class="nav-icon" aria-hidden="true">◇</span>下游管理</a>
        <a class="nav-link" href="#" data-demo="商户管理"><span class="nav-icon" aria-hidden="true">▦</span>商户管理</a>
        <p class="nav-caption">账户</p>
        <a class="nav-link" href="#" data-demo="个人中心"><span class="nav-icon" aria-hidden="true">◉</span>个人中心</a>
      </nav>
      <div class="sidebar-foot">统一工作台视觉样例<br>仅展示界面与本地演示数据</div>
    </aside>
    <header class="header">
      <button class="hamburger" id="menuToggle" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
      <div class="breadcrumb"><span>车险业务</span><span aria-hidden="true">›</span><strong>工单管理</strong></div>
      <div class="header-actions"><button class="header-link" type="button" data-demo="返回门户">↗ 返回门户</button><span class="avatar" aria-hidden="true">张</span><div class="user">张经理<small>业务管理员</small></div></div>
    </header>
    <main id="orders">
      <div class="page-heading"><div><p class="eyebrow">INSURANCE WORKSPACE</p><h1>工单管理</h1><p>集中查询、跟进和处理车险业务工单</p></div><span class="badge-demo">静态 UI 样例 · 演示数据</span></div>
      <section class="panel" aria-labelledby="filter-title"><div class="panel-head"><div><h2 id="filter-title">查询筛选</h2><p>沿用现有查询字段与工单状态</p></div></div><div class="panel-body">
        <div class="filter-grid">
          <div class="field"><label for="keyword">查询条件</label><input class="control" id="keyword" placeholder="工单编号、号牌号码、车架号或车主"></div>
          <div class="field"><label for="dateType">日期类型</label><select class="control" id="dateType"><option>创建时间</option><option>最后跟进时间</option><option>承保时间</option></select></div>
          <div class="field"><label for="dateStart">开始日期</label><input class="control" type="date" id="dateStart"></div>
          <div class="field"><label for="dateEnd">结束日期</label><input class="control" type="date" id="dateEnd"></div>
          <div class="field"><label for="merchant">出单商铺</label><select class="control" id="merchant"><option value="">全部商铺</option><option>城南汽车服务店</option><option>顺达汽修中心</option><option>安途汽车服务</option></select></div>
          <div class="field"><label for="handler">处理人员</label><select class="control" id="handler"><option value="">全部人员</option><option>李敏</option><option>王涛</option><option>陈晨</option></select></div>
          <div class="field"><label for="area">投保区域</label><select class="control" id="area"><option value="">全部区域</option><option>上海</option><option>江苏</option><option>浙江</option></select></div>
          <div class="field"><label for="insurance">保险公司</label><select class="control" id="insurance"><option value="">全部保险公司</option><option>人保财险</option><option>平安产险</option><option>太平洋产险</option></select></div>
        </div>
        <div class="filter-bottom"><div class="field"><label>工单状态</label><div class="status-group" role="group" aria-label="工单状态"><button class="status-chip active" type="button" data-status="全部" aria-pressed="true">全部</button><button class="status-chip" type="button" data-status="待报价" aria-pressed="false">待报价</button><button class="status-chip" type="button" data-status="待承保" aria-pressed="false">待承保</button><button class="status-chip" type="button" data-status="承保失败" aria-pressed="false">承保失败</button><button class="status-chip" type="button" data-status="承保成功" aria-pressed="false">承保成功</button></div></div><div class="actions"><button class="btn" id="reset" type="button">重置</button><button class="btn primary" id="search" type="button">查询工单</button><button class="btn" type="button" data-demo="新建工单">＋ 新建工单</button></div></div>
      </div></section>
      <section class="panel" aria-labelledby="result-title"><div class="panel-head"><div class="result-title"><h2 id="result-title">查询结果</h2><span class="count" id="resultCount"></span></div><button class="btn" type="button" data-demo="导出">⇩ 导出</button></div><div class="table-wrap"><table><thead><tr><th>工单号 / 车辆</th><th>车主 / 提交店铺</th><th>投保区域</th><th>保险公司</th><th>政策费用</th><th>处理人</th><th>工单状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="orderRows"></tbody></table></div><div class="pagination"><span id="pageSummary"></span><div class="page-buttons" id="pageButtons"></div></div></section>
    </main>
  </div>
  <script>
    /* 仅用于展示筛选、分页和反馈外观；不请求服务，也不改变车险系统业务逻辑。 */
    const orders=[
      {code:'BX202609140018',vehicle:'沪A·6M82Q',owner:'赵女士',merchant:'城南汽车服务店',area:'上海',insurance:'人保财险',amount:'¥ 3,680.00',handler:'李敏',status:'待报价',date:'2026-09-14 09:42'},
      {code:'BX202609140017',vehicle:'苏E·2K91R',owner:'周先生',merchant:'顺达汽修中心',area:'江苏',insurance:'平安产险',amount:'¥ 4,280.00',handler:'王涛',status:'待承保',date:'2026-09-14 08:35'},
      {code:'BX202609130041',vehicle:'浙B·8P36A',owner:'林女士',merchant:'安途汽车服务',area:'浙江',insurance:'太平洋产险',amount:'¥ 2,950.00',handler:'陈晨',status:'承保成功',date:'2026-09-13 16:20'},
      {code:'BX202609130039',vehicle:'沪C·5N73K',owner:'陈先生',merchant:'城南汽车服务店',area:'上海',insurance:'人保财险',amount:'¥ 3,320.00',handler:'李敏',status:'承保失败',date:'2026-09-13 14:08'},
      {code:'BX202609130026',vehicle:'苏A·7J45M',owner:'吴女士',merchant:'顺达汽修中心',area:'江苏',insurance:'平安产险',amount:'¥ 4,060.00',handler:'王涛',status:'待报价',date:'2026-09-13 11:56'},
      {code:'BX202609120015',vehicle:'浙A·9T12X',owner:'刘先生',merchant:'安途汽车服务',area:'浙江',insurance:'太平洋产险',amount:'¥ 3,840.00',handler:'陈晨',status:'待承保',date:'2026-09-12 10:17'}
    ];
    const classByStatus={'待报价':'quote','待承保':'insure','承保失败':'fail','承保成功':'done'};let selectedStatus='全部',filtered=orders,page=1;const pageSize=5;
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function render(){const totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,totalPages);document.getElementById('resultCount').textContent=`共 ${filtered.length} 条演示工单`;document.getElementById('pageSummary').textContent=`第 ${page} / ${totalPages} 页 · 每页 ${pageSize} 条`;document.getElementById('orderRows').innerHTML=filtered.length?filtered.slice((page-1)*pageSize,page*pageSize).map(order=>`<tr><td><span class="order">${escapeHtml(order.code)}</span><span class="cell-sub vehicle">${escapeHtml(order.vehicle)}</span></td><td><strong>${escapeHtml(order.owner)}</strong><span class="cell-sub">${escapeHtml(order.merchant)}</span></td><td>${escapeHtml(order.area)}</td><td>${escapeHtml(order.insurance)}</td><td class="money">${escapeHtml(order.amount)}</td><td>${escapeHtml(order.handler)}</td><td><span class="state ${classByStatus[order.status]}">${escapeHtml(order.status)}</span></td><td>${escapeHtml(order.date)}</td><td><div class="row-actions"><button class="btn small text" type="button" data-demo="查看工单详情">查看详情</button><button class="btn small" type="button" data-demo="转移工单">转移</button></div></td></tr>`).join(''):`<tr><td colspan="9"><div class="empty">没有符合条件的演示工单，请调整筛选条件。</div></td></tr>`;document.getElementById('pageButtons').innerHTML=Array.from({length:totalPages},(_,i)=>`<button type="button" class="page-btn ${page===i+1?'active':''}" data-page="${i+1}" aria-label="第 ${i+1} 页" ${page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}
    function search(){const keyword=document.getElementById('keyword').value.trim().toLowerCase(),merchant=document.getElementById('merchant').value,handler=document.getElementById('handler').value,area=document.getElementById('area').value,insurance=document.getElementById('insurance').value,start=document.getElementById('dateStart').value,end=document.getElementById('dateEnd').value;filtered=orders.filter(o=>(selectedStatus==='全部'||o.status===selectedStatus)&&(!keyword||[o.code,o.vehicle,o.owner].some(v=>v.toLowerCase().includes(keyword)))&&(!merchant||o.merchant===merchant)&&(!handler||o.handler===handler)&&(!area||o.area===area)&&(!insurance||o.insurance===insurance)&&(!start||o.date.slice(0,10)>=start)&&(!end||o.date.slice(0,10)<=end));page=1;render()}
    function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=`${message}：静态样例未连接业务系统`;document.body.append(el);setTimeout(()=>el.remove(),3000)}
    document.getElementById('search').addEventListener('click',search);document.getElementById('keyword').addEventListener('keydown',event=>{if(event.key==='Enter')search()});document.getElementById('reset').addEventListener('click',()=>{['keyword','dateStart','dateEnd','merchant','handler','area','insurance'].forEach(id=>document.getElementById(id).value='');document.getElementById('dateType').selectedIndex=0;selectedStatus='全部';document.querySelectorAll('.status-chip').forEach(chip=>{chip.classList.toggle('active',chip.dataset.status==='全部');chip.setAttribute('aria-pressed',String(chip.dataset.status==='全部'))});search()});document.querySelectorAll('.status-chip').forEach(chip=>chip.addEventListener('click',()=>{selectedStatus=chip.dataset.status;document.querySelectorAll('.status-chip').forEach(item=>{const active=item===chip;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active))});search()}));document.addEventListener('click',event=>{const pageButton=event.target.closest('[data-page]'),demoButton=event.target.closest('[data-demo]');if(pageButton){page=Number(pageButton.dataset.page);render()}if(demoButton){event.preventDefault();toast(demoButton.dataset.demo)}});const sidebar=document.getElementById('sidebar'),scrim=document.getElementById('scrim'),toggle=document.getElementById('menuToggle');function closeMenu(){sidebar.classList.remove('open');scrim.classList.remove('open');toggle.setAttribute('aria-expanded','false')}toggle.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');scrim.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open))});scrim.addEventListener('click',closeMenu);document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu()});render();
  </script>
</body>
</html>
